# Whole stack in one command: `docker compose up --build`.
# Dev-mode throughout (bind-mounted source, tsx/vite watch) — this is a
# disposable demo app, not a production setup.
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: apidev
      POSTGRES_PASSWORD: apidev
      POSTGRES_DB: apidev
    ports:
      - "5432:5432"
    volumes:
      - api-dev-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apidev -d apidev"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    ipc: host
    security_opt:
      - seccomp=./deploy/playwright-seccomp.json
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://apidev:apidev@postgres:5432/apidev?schema=public
      REDIS_URL: redis://redis:6379
      PORT: "3000"
      PUBLIC_URL: http://localhost:3000
      CORS_ORIGIN: http://localhost:5173
      JWT_ACCESS_SECRET: dev-access-secret-change-me-dev-access-secret-change-me
      JWT_REFRESH_SECRET: dev-refresh-secret-change-me-dev-refresh-secret-change-me
      JWT_ACCESS_TTL: 15m
      REFRESH_TOKEN_TTL_DAYS: "30"
      DEFAULT_RATE_LIMIT_POINTS: "60"
      DEFAULT_RATE_LIMIT_WINDOW_SECONDS: "60"
      URL_SHORT_CODE_LENGTH: "7"
      PDF_RENDER_TIMEOUT_MS: "30000"
      PDF_MAX_CONCURRENT_RENDERS: "2"
      PDF_MAX_QUEUED_RENDERS: "10"
      PDF_QUEUE_TIMEOUT_MS: "5000"
      PDF_HTML_MAX_BYTES: "1048576"
      PDF_DEFAULT_FORMAT: A4
      PDF_RATE_LIMIT_POINTS: "10"
      PDF_RATE_LIMIT_WINDOW_SECONDS: "60"
      WEBHOOKS_MAX_ATTEMPTS: "5"
      WEBHOOKS_TIMEOUT_MS: "5000"
      WEBHOOKS_BACKOFF_BASE_SECONDS: "10"
      WEBHOOKS_BACKOFF_MAX_SECONDS: "3600"
      WEBHOOKS_POLL_INTERVAL_MS: "1000"
      WEBHOOKS_MAX_CONCURRENT_DELIVERIES: "5"
      WEBHOOKS_MAX_RESPONSE_BYTES: "2048"
      # Dev-only: this compose file is a local demo stack, so deliveries are
      # allowed to reach private addresses (your own receiver). Never set
      # this in a real deployment — see .env.example.
      WEBHOOKS_ALLOW_PRIVATE_DESTINATIONS: "true"
    ports:
      - "3000:3000"
    volumes:
      - ./src:/app/src
      - ./prisma:/app/prisma
      - ./scripts:/app/scripts
    # Regenerates the client (the bind-mounted ./src can shadow the one
    # baked in at build time with a stale copy from the host) and applies
    # pending migrations against the (possibly fresh) postgres container
    # before starting the watch server.
    command: sh -c "npx prisma generate && npx prisma migrate deploy && npm run dev"

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    environment:
      API_PROXY_TARGET: http://api:3000
    ports:
      - "5173:5173"
    volumes:
      - ./web/src:/app/src
      - ./web/index.html:/app/index.html

volumes:
  api-dev-postgres:
